    <h1>Mini Check Game</h1>
    <div id="scoreboard">Score: <span id="score">0</span></div>
    <div id="board"></div>
    <div id="end-message"></div>
  
    <script>
      const board = document.getElementById('board');
      const scoreDisplay = document.getElementById('score');
      const endMessage = document.getElementById('end-message');
  
      let score = 0;
      let selected = null;
  
      const squares = [];
      const boardSize = 8;
  
      // Build board
      for (let row = 0; row < boardSize; row++) {
        for (let col = 0; col < boardSize; col++) {
          const square = document.createElement('div');
          square.classList.add('square');
          square.classList.add((row + col) % 2 === 0 ? 'light' : 'dark');
          square.dataset.row = row;
          square.dataset.col = col;
          board.appendChild(square);
          squares.push(square);
        }
      }
  
      // Add player and enemies
      function setupPieces() {
        squares.forEach(sq => sq.innerHTML = '');
        for (let i = 0; i < 8; i++) {
          const enemy = document.createElement('div');
          enemy.classList.add('enemy');
          squares[i].appendChild(enemy);
        }
  
        const player = document.createElement('div');
        player.classList.add('player');
        squares[56].appendChild(player);
      }
  
      setupPieces();
  
      board.addEventListener('click', (e) => {
        const square = e.target.closest('.square');
        if (!square) return;
  
        const piece = square.querySelector('.player');
  
        if (piece) {
          selected = square;
        } else if (selected) {
          const targetRow = parseInt(square.dataset.row);
          const targetCol = parseInt(square.dataset.col);
          const startRow = parseInt(selected.dataset.row);
          const startCol = parseInt(selected.dataset.col);
  
          const rowDiff = targetRow - startRow;
          const colDiff = Math.abs(targetCol - startCol);
  
          if (rowDiff === -1 && colDiff === 1) {
            square.appendChild(selected.querySelector('.player'));
            selected = null;
  
            if (square.querySelector('.enemy')) {
              square.removeChild(square.querySelector('.enemy'));
              score += 10;
              scoreDisplay.textContent = score;
  
              if (document.querySelectorAll('.enemy').length === 0) {
                endMessage.textContent = "You win!";
              }
            }
          }
        }
      });
  
      // Optional: lose condition after timer
      setTimeout(() => {
        if (document.querySelectorAll('.enemy').length > 0) {
          endMessage.textContent = "You lost! Enemies remain.";
          board.style.pointerEvents = 'none';
        }
      }, 30000); // 30 seconds to win
    </script>
  
  </body>
